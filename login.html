<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Entrar | PRIV</title>
<style>
:root{color-scheme:dark;--bg:#000;--panel:#111;--line:#444;--white:#fff;--muted:#bdbdbd}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#181818,transparent 55%),var(--bg);color:var(--white);font:16px system-ui,-apple-system,Arial,sans-serif;display:grid;place-items:center;padding:24px}main{width:min(100%,440px)}.brand{display:block;text-align:center;text-decoration:none;color:#fff;margin-bottom:24px}.logo{font-size:54px;font-weight:950;font-style:italic;letter-spacing:-4px;line-height:1}.logo span{color:#e52b49}.sub{font-size:11px;letter-spacing:4px;color:#ff7a8d;font-weight:800;margin-top:5px}.card{background:rgba(17,17,17,.96);border:1px solid #444;border-radius:20px;padding:25px;box-shadow:0 22px 70px #0008}h1{font-size:26px;margin:0 0 7px}.intro{color:var(--muted);margin:0 0 22px;line-height:1.5}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:22px}.tab{border:1px solid #555;border-radius:10px;padding:11px;background:#111;color:#ddd;font:inherit;cursor:pointer}.tab[aria-selected=true]{background:#fff;border-color:#fff;color:#000;font-weight:750}.field{display:grid;gap:7px;margin:15px 0}label{font-size:14px;color:#eee}input{width:100%;border:1px solid #555;background:#080808;color:#fff;border-radius:10px;padding:13px;font:inherit;outline:none}input:focus{border-color:#fff}.check{display:flex;align-items:flex-start;gap:10px;color:#ddd;font-size:13px;line-height:1.45;margin:16px 0}.check input{width:18px;height:18px;flex:0 0 18px;margin:0;accent-color:#fff}.button{display:block;width:100%;border:1px solid #fff;border-radius:11px;background:#fff;color:#000;padding:13px 16px;font:inherit;font-weight:800;cursor:pointer;margin-top:18px}.status{min-height:22px;color:#ddd;font-size:14px;line-height:1.45;margin:14px 0 0}.hidden{display:none!important}.fine{margin-top:15px;color:#888;text-align:center;font-size:12px;line-height:1.45}a{color:#fff}
</style></head><body><main>
<a class="brand" href="/" aria-label="PRIV"><div class="logo"><span>P</span>RIV</div><div class="sub">EXCLUSIVO +18</div></a>
<section class="card"><h1>Entre para continuar</h1><p class="intro">Acesse sua conta ou crie uma nova para ver a vitrine.</p>
<div class="tabs" role="tablist"><button id="loginTab" class="tab" type="button" role="tab" aria-selected="true">Entrar</button><button id="registerTab" class="tab" type="button" role="tab" aria-selected="false">Criar conta</button></div>
<form id="loginForm"><div class="field"><label for="loginEmail">E-mail</label><input id="loginEmail" type="email" autocomplete="username" placeholder="voce@exemplo.com" required></div><div class="field"><label for="loginPassword">Senha</label><input id="loginPassword" type="password" autocomplete="current-password" required></div><button class="button" type="submit">Entrar</button></form>
<form id="registerForm" class="hidden"><div class="field"><label for="registerEmail">E-mail</label><input id="registerEmail" type="email" autocomplete="email" placeholder="voce@exemplo.com" required></div><div class="field"><label for="registerPassword">Criar senha</label><input id="registerPassword" type="password" autocomplete="new-password" minlength="12" required></div><div class="field"><label for="registerConfirm">Confirmar senha</label><input id="registerConfirm" type="password" autocomplete="new-password" minlength="12" required></div><label class="check"><input id="adultConfirmed" type="checkbox" required><span>Confirmo que tenho 18 anos ou mais.</span></label><button class="button" type="submit">Criar conta</button></form>
<p id="status" class="status" role="status" aria-live="polite"></p></section>
<p class="fine">Ao continuar, você confirma que tem 18 anos ou mais.</p>
</main>
<script>
"use strict";
const $=id=>document.getElementById(id);
const next=new URLSearchParams(location.search).get("next");
function destination(){return next&&next.startsWith("/")&&!next.startsWith("//")?next:"/"}
async function call(path,data){const r=await fetch(path,{method:data?"POST":"GET",credentials:"same-origin",cache:"no-store",headers:data?{"content-type":"application/json"}:{},body:data?JSON.stringify(data):undefined});let out={};try{out=await r.json()}catch{}if(!r.ok)throw Error(out.error||"Não foi possível concluir.");return out}
function mode(which){const login=which==="login";$("loginForm").classList.toggle("hidden",!login);$("registerForm").classList.toggle("hidden",login);$("loginTab").setAttribute("aria-selected",String(login));$("registerTab").setAttribute("aria-selected",String(!login));$("status").textContent=""}
$("loginTab").onclick=()=>mode("login");$("registerTab").onclick=()=>mode("register");
$("loginForm").onsubmit=async e=>{e.preventDefault();$("status").textContent="Entrando…";try{await call("/api/auth/login",{email:$("loginEmail").value.trim(),password:$("loginPassword").value});location.replace(destination())}catch(err){$("status").textContent=err.message}};
$("registerForm").onsubmit=async e=>{e.preventDefault();if($("registerPassword").value!==$("registerConfirm").value){$("status").textContent="As senhas não conferem.";return}if($("registerPassword").value.length<12){$("status").textContent="Use uma senha com pelo menos 12 caracteres.";return}if(!$("adultConfirmed").checked){$("status").textContent="Confirme que você tem 18 anos ou mais.";return}$("status").textContent="Criando conta…";try{await call("/api/auth/register",{email:$("registerEmail").value.trim(),password:$("registerPassword").value,adultConfirmed:true});$("registerPassword").value=$("registerConfirm").value="";location.replace(destination())}catch(err){$("status").textContent=err.message}};
call("/api/auth/session").then(()=>location.replace("/")).catch(()=>{});
</script></body></html>
