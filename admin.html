<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#000"><title>Entrar | PRIV</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font:16px system-ui,Arial}header{padding:20px 5%;border-bottom:1px solid #444;display:flex;justify-content:space-between;align-items:center;gap:12px}h1{margin:0;font-size:25px}main{max-width:900px;margin:auto;padding:24px 5% 100px}.auth-tabs{display:flex;gap:8px;margin-bottom:18px}.auth-tabs .btn{flex:1}.panel,.profile{background:#111;border:1px solid #444;border-radius:14px;padding:20px;margin:16px 0}.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:7px;margin:0 0 14px}label{color:#ddd;font-size:14px}input,textarea{width:100%;background:#080808;border:1px solid #555;border-radius:9px;padding:12px;color:#fff;font:inherit}textarea{min-height:100px;resize:vertical}input[type=checkbox]{width:auto;accent-color:#fff}.checks{display:flex;flex-wrap:wrap;gap:18px;margin:8px 0 16px}.checks label{display:flex;align-items:center;gap:8px}.btn{border:1px solid #fff;border-radius:10px;padding:12px 16px;background:#fff;color:#000;font-weight:750;font:inherit;cursor:pointer}.btn.secondary{background:transparent;color:#fff;border-color:#777}.actions{display:flex;gap:10px;flex-wrap:wrap}.status{min-height:24px;color:#ccc;margin:12px 0 0}.muted{color:#aaa;line-height:1.5;font-size:14px}.profile h2{margin-top:0}.hidden{display:none!important}.danger{color:#ffb4b4}@media(max-width:600px){.row{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}}
</style></head>
<body><header><h1>PRIV</h1><button id="logout" class="btn secondary hidden" type="button">Sair</button></header>
<main>
<section id="auth" class="panel">
<div class="auth-tabs" id="authTabs"><button id="tabLogin" class="btn" type="button">Entrar</button><button id="tabCreate" class="btn secondary hidden" type="button">Criar conta</button></div><div id="loginBox"><h2>Bem-vindo ao PRIV</h2><p class="muted">Entre na sua conta para continuar.</p><form id="loginForm"><div class="field"><label for="loginEmail">E-mail</label><input id="loginEmail" type="email" autocomplete="username" placeholder="voce@exemplo.com" required></div><div class="field"><label for="loginPassword">Senha</label><input id="loginPassword" type="password" autocomplete="current-password" required></div><button class="btn" type="submit">Entrar</button></form></div>
<div id="setupBox" class="hidden"><h2>Criar conta</h2><p class="muted">Informe seu e-mail e crie uma senha. O código de confirmação é usado uma vez e expira em 24 horas.</p><form id="setupForm"><div class="field"><label for="setupToken">Código de ativação</label><input id="setupToken" type="password" autocomplete="off" required></div><div class="field"><label for="setupEmail">E-mail</label><input id="setupEmail" type="email" autocomplete="email" placeholder="voce@exemplo.com" required></div><div class="field"><label for="setupPassword">Criar senha</label><input id="setupPassword" type="password" autocomplete="new-password" minlength="12" required></div><div class="field"><label for="setupConfirm">Confirmar senha</label><input id="setupConfirm" type="password" autocomplete="new-password" minlength="12" required></div><button class="btn" type="submit">Criar conta</button></form></div>
<p id="authStatus" class="status" role="status"></p></section>
<section id="editor" class="hidden">
<div class="panel"><h2>Dados da vitrine</h2><p class="muted">O que você salvar aqui aparece no site público. Use nomes e informações autorizados pela pessoa.</p><div class="row"><div class="field"><label for="city">Cidade exibida</label><input id="city"></div><div class="field"><label for="about">Texto da seção</label><input id="about"></div></div></div>
<div id="profiles"></div>
<div class="panel"><div class="actions"><button id="addProfile" class="btn secondary" type="button">Adicionar perfil</button><button id="save" class="btn" type="button">Salvar no site</button></div><p id="saveStatus" class="status" role="status"></p></div>
</section></main>
<script>
"use strict";
const $=id=>document.getElementById(id), allowedEmail="thalisfreitasdesousa1@gmail.com";
let content={site:{},profiles:[]},setupAvailable=false;
$("tabLogin").onclick=()=>{$("loginBox").classList.remove("hidden");$("setupBox").classList.add("hidden");$("authStatus").textContent=""};
$("tabCreate").onclick=()=>{if(!setupAvailable){$("authStatus").textContent="O cadastro inicial já foi concluído. Entre com seu e-mail e senha.";return}$("loginBox").classList.add("hidden");$("setupBox").classList.remove("hidden");$("authStatus").textContent=""};
async function api(path,method="GET",body){const r=await fetch(path,{method,credentials:"same-origin",headers:body?{"content-type":"application/json"}:{},body:body?JSON.stringify(body):undefined,cache:"no-store"});let data={};try{data=await r.json()}catch{}if(!r.ok)throw Error(data.error||"Não foi possível concluir a solicitação.");return data}
function slug(s){return String(s||"perfil").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"perfil"}
function profileCard(p,i){const box=document.createElement("article");box.className="profile";box.dataset.index=i;box.innerHTML='<h2>Perfil '+(i+1)+'</h2><div class="row"><div class="field"><label>Nome público</label><input data-key="name" maxlength="80"></div><div class="field"><label>Idade (opcional; mínimo 18)</label><input data-key="age" type="number" min="18" max="99"></div></div><div class="row"><div class="field"><label>Cidade (opcional)</label><input data-key="city" maxlength="80"></div><div class="field"><label>Descrição</label><input data-key="bio" maxlength="240"></div></div><div class="field"><label>Fotos (um endereço por linha)</label><textarea data-key="photos"></textarea></div><div class="checks"><label><input data-key="adultVerified" type="checkbox"> Maioridade verificada</label><label><input data-key="consent" type="checkbox"> Autorização confirmada</label><label><input data-key="published" type="checkbox"> Publicado</label></div><button class="btn secondary remove" type="button">Remover perfil</button>';
for(const k of ["name","age","city","bio"])box.querySelector('[data-key="'+k+'"]').value=p[k]??"";
box.querySelector('[data-key="photos"]').value=(p.photos||[]).join("\n");
for(const k of ["adultVerified","consent","published"])box.querySelector('[data-key="'+k+'"]').checked=p[k]===true;
box.querySelector(".remove").onclick=()=>box.remove();return box}
function renderEditor(d){content=d||{site:{},profiles:[]};$("city").value=content.site?.city||"";$("about").value=content.site?.about||"";$("profiles").replaceChildren(...(content.profiles||[]).map(profileCard))}
function collect(){const profiles=[...$("profiles").children].map(box=>{const get=k=>box.querySelector('[data-key="'+k+'"]');const name=get("name").value.trim(),old=(content.profiles||[])[Number(box.dataset.index)]||{};const age=get("age").value?Number(get("age").value):null;const photos=get("photos").value.split("\n").map(x=>x.trim()).filter(Boolean);if(age!==null&&age<18)throw Error("A idade de um perfil publicado precisa ser 18 ou mais.");if(photos.length>12)throw Error("Cada perfil pode ter no máximo 12 fotos.");if(photos.some(u=>!(/^https:\/\//i.test(u)||/^\/assets\/[a-z0-9._/-]+$/i.test(u))))throw Error("Use endereços HTTPS ou caminhos /assets/ para as fotos.");return{...old,id:old.id||slug(name),name,age,bio:get("bio").value.trim(),city:get("city").value.trim(),photos,adultVerified:get("adultVerified").checked,consent:get("consent").checked,published:get("published").checked}});return{...content,site:{...content.site,brand:"PRIV",city:$("city").value.trim(),about:$("about").value.trim()},profiles}}
$("loginForm").onsubmit=async e=>{e.preventDefault();$("authStatus").textContent="Entrando…";try{await api("/api/admin/login","POST",{email:$("loginEmail").value.trim().toLowerCase(),password:$("loginPassword").value});$("loginPassword").value="";await startEditor()}catch(err){$("authStatus").textContent=err.message}};
$("setupForm").onsubmit=async e=>{e.preventDefault();const p=$("setupPassword").value,setupToken=$("setupToken").value.trim();if(p!==$("setupConfirm").value){$("authStatus").textContent="As senhas não conferem.";return}if(p.length<12){$("authStatus").textContent="Use uma senha com pelo menos 12 caracteres.";return}$("authStatus").textContent="Criando conta…";try{await api("/api/admin/setup","POST",{email:$("setupEmail").value.trim().toLowerCase(),password:p,setupToken});$("setupToken").value="";$("setupPassword").value=$("setupConfirm").value="";$("authStatus").textContent="Conta criada com segurança.";await startEditor()}catch(err){$("authStatus").textContent=err.message}};
async function startEditor(){try{const s=await api("/api/admin/session");if(s.email!==allowedEmail)throw Error("Conta não autorizada.");content=await api("/api/admin/content");renderEditor(content);$("editor").classList.remove("hidden");$("auth").classList.add("hidden");$("logout").classList.remove("hidden")}catch(err){$("authStatus").textContent=err.message}}
$("logout").onclick=async()=>{try{await api("/api/admin/logout","POST",{})}finally{location.reload()}};
$("addProfile").onclick=()=>{$("profiles").append(profileCard({id:"",name:"",age:"",bio:"",photos:[],published:false,consent:false,adultVerified:false},$("profiles").children.length))};
$("save").onclick=async()=>{try{$("saveStatus").textContent="Salvando…";content=collect();await api("/api/admin/content","PUT",content);renderEditor(content);$("saveStatus").textContent="Salvo. A vitrine pública já foi atualizada."}catch(err){$("saveStatus").textContent=err.message}};
api("/api/admin/setup-status").then(s=>{setupAvailable=s.available===true;if(setupAvailable)$("tabCreate").classList.remove("hidden")}).catch(()=>{});api("/api/admin/session").then(s=>{if(s.email===allowedEmail)startEditor()}).catch(()=>{});
</script></body></html>
