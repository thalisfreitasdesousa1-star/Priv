<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#000"><title>Entrar | PRIV</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font:16px system-ui,Arial}header{padding:20px 5%;border-bottom:1px solid #444;display:flex;justify-content:space-between;align-items:center;gap:12px}h1{margin:0;font-size:25px}main{max-width:900px;margin:auto;padding:24px 5% 100px}.auth-tabs{display:flex;gap:8px;margin-bottom:18px}.auth-tabs .btn{flex:1}.panel,.profile{background:#111;border:1px solid #444;border-radius:14px;padding:20px;margin:16px 0}.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:7px;margin:0 0 14px}label{color:#ddd;font-size:14px}input,textarea{width:100%;background:#080808;border:1px solid #555;border-radius:9px;padding:12px;color:#fff;font:inherit}textarea{min-height:100px;resize:vertical}input[type=checkbox]{width:auto;accent-color:#fff}.checks{display:flex;flex-wrap:wrap;gap:18px;margin:8px 0 16px}.checks label{display:flex;align-items:center;gap:8px}.btn{border:1px solid #fff;border-radius:10px;padding:12px 16px;background:#fff;color:#000;font-weight:750;font:inherit;cursor:pointer}.btn.secondary{background:transparent;color:#fff;border-color:#777}.actions{display:flex;gap:10px;flex-wrap:wrap}.status{min-height:24px;color:#ccc;margin:12px 0 0}.muted{color:#aaa;line-height:1.5;font-size:14px}.profile h2{margin-top:0}.hidden{display:none!important}.danger{color:#ffb4b4}@media(max-width:600px){.row{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}}
.media-tools{display:grid;gap:12px}.media-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}.media-item{background:#090909;border:1px solid #444;border-radius:10px;padding:8px}.media-item img,.media-item video{width:100%;height:140px;object-fit:contain;background:#000;border-radius:7px}.media-actions{display:flex;gap:5px;margin-top:7px}.media-actions button{flex:1;padding:6px 4px;font-size:13px}.preview{margin:16px 0;border:1px solid #444;border-radius:12px;overflow:hidden}.preview summary{padding:12px;cursor:pointer;font-weight:700}.preview-card{display:grid;grid-template-columns:minmax(120px,35%) 1fr;gap:14px;padding:14px}.preview-card img,.preview-card video{width:100%;max-height:260px;object-fit:contain;background:#000;border-radius:8px}.help{color:#aaa;font-size:13px}.field textarea{min-height:115px}@media(max-width:600px){.preview-card{grid-template-columns:1fr}.media-list{grid-template-columns:repeat(2,minmax(0,1fr))}}.dashboard-top{display:flex;justify-content:space-between;align-items:center;gap:16px}.dashboard-top h2{margin:0 0 6px}.dashboard-top p{margin:0}.ad-list{display:grid;gap:12px}.ad-row{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:14px;background:#111;border:1px solid #444;border-radius:14px}.ad-cover{width:110px;height:120px;display:grid;place-items:center;overflow:hidden;border-radius:9px;background:#080808;color:#aaa;font-size:13px;text-align:center}.ad-cover img{width:100%;height:100%;object-fit:cover}.ad-body h3{margin:0 0 7px}.ad-body p{margin:8px 0}.ad-status{display:inline-block;border-radius:99px;padding:4px 9px;font-size:12px}.ad-status.is-published{background:#183c25;color:#b9f2c8}.ad-status.is-draft{background:#333;color:#ddd}.ad-actions{display:flex;gap:8px;margin-top:12px}.edit-heading{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:14px}.edit-heading h2{margin:0}.edit-heading p{margin:4px 0 0}.site-settings summary{cursor:pointer;font-weight:700}.site-settings .row{margin-top:16px}.empty{padding:22px;text-align:center;color:#aaa;background:#111;border:1px dashed #555;border-radius:14px}.hidden{display:none!important}@media(max-width:600px){.dashboard-top{align-items:stretch;flex-direction:column}.dashboard-top .btn{width:100%}.ad-row{grid-template-columns:76px 1fr;padding:10px;gap:10px}.ad-cover{width:76px;height:100px}.ad-actions{flex-direction:column}.ad-actions .btn{width:100%}.edit-heading{grid-template-columns:1fr}.edit-heading .btn{justify-self:start}}</style></head>
<body><header><h1>PRIV</h1><button id="logout" class="btn secondary" type="button">Voltar à vitrine</button></header>
<main>
<p id="loadStatus" class="status" role="status" aria-live="polite">Carregando o gerenciador…</p>
<section id="editor">
<section id="listView">
<div class="panel dashboard-top"><div><h2>Anúncios da vitrine</h2><p class="muted"><span id="profileCount">0 anúncios</span>. Toque em um anúncio para editar só ele.</p></div><button id="addProfile" class="btn" type="button">+ Novo anúncio</button></div>
<div id="profileList" class="ad-list"></div><p id="listStatus" class="status" role="status" aria-live="polite"></p>
<details class="panel site-settings"><summary>Configurações da vitrine</summary><div class="row"><div class="field"><label for="city">Cidade exibida</label><input id="city"></div><div class="field"><label for="about">Texto da seção</label><input id="about"></div></div><button id="saveSite" class="btn secondary" type="button">Salvar configurações</button><p id="siteStatus" class="status" role="status" aria-live="polite"></p></details>
</section>
<section id="editView" class="hidden">
<div class="panel edit-heading"><button id="backToList" class="btn secondary" type="button">← Anúncios</button><div><h2 id="editTitle">Novo anúncio</h2><p class="muted">Edite apenas este anúncio. Cadastre nome, idade, descrição e mídia.</p></div></div>
<div id="profileEditor"></div>
<div class="panel"><div class="actions"><button id="cancelEdit" class="btn secondary" type="button">Cancelar</button><button id="saveProfile" class="btn" type="button">Salvar anúncio</button></div><p id="saveStatus" class="status" role="status" aria-live="polite"></p></div>
</section>
</section></main>
<script>"use strict";
const $=id=>document.getElementById(id),allowedEmail="thalisfreitasdesousa1@gmail.com";
let content={site:{},profiles:[]},setupAvailable=false,editingId=null,isNewAd=false;
async function api(path,method="GET",body){const r=await fetch(path,{method,credentials:"same-origin",headers:body?{"content-type":"application/json"}:{},body:body?JSON.stringify(body):undefined,cache:"no-store"});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||"Não foi possível concluir a solicitação.");return d}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function safeMedia(u){return typeof u==="string"&&(/^https:\/\//i.test(u)||/^\/assets\/[a-z0-9._/-]+$/i.test(u)||/^\/media\/(photos|videos)\/[a-f0-9-]+\.(jpg|jpeg|png|webp|avif|mp4|webm|mov)$/i.test(u))}
function renderList(){const profiles=content.profiles||[];$("profileCount").textContent=profiles.length===1?"1 anúncio":profiles.length+" anúncios";const list=$("profileList");list.replaceChildren();if(!profiles.length){const p=document.createElement("p");p.className="empty";p.textContent="Nenhum anúncio ainda. Toque em “Novo anúncio” para começar.";list.append(p);return}
profiles.forEach((p,i)=>{const card=document.createElement("article");card.className="ad-row";const cover=document.createElement("div");cover.className="ad-cover";const photo=(Array.isArray(p.photos)?p.photos:[]).find(safeMedia);if(photo){const img=document.createElement("img");img.src=photo;img.alt="Foto de "+(p.name||"anúncio");img.loading="lazy";cover.append(img)}else cover.textContent="Sem foto";
const body=document.createElement("div");body.className="ad-body";const name=document.createElement("h3");name.textContent=p.name||"Anúncio sem nome";const details=document.createElement("p");details.className="muted";details.textContent=[p.age&&Number(p.age)>=18?Number(p.age)+" anos":null,p.city,p.bio].filter(Boolean).join(" · ")||"Adicione idade, cidade e descrição no editor.";const status=document.createElement("span");status.className="ad-status "+(p.published===true?"is-published":"is-draft");status.textContent=p.published===true?"Publicado":"Rascunho";const actions=document.createElement("div");actions.className="ad-actions";const edit=document.createElement("button");edit.type="button";edit.className="btn";edit.textContent="Editar anúncio";edit.onclick=()=>openEditor(p.id);const del=document.createElement("button");del.type="button";del.className="btn secondary";del.textContent="Excluir";del.onclick=()=>deleteAd(p.id);actions.append(edit,del);body.append(name,status,details,actions);card.append(cover,body);list.append(card)})}
function makeMediaItem(url,kind,index,total,box){const item=document.createElement("div");item.className="media-item";const node=document.createElement(kind==="video"?"video":"img");node.src=url;if(kind==="video"){node.controls=true;node.playsInline=true;node.preload="metadata"}else node.alt="Prévia da foto";item.append(node);const actions=document.createElement("div");actions.className="media-actions";for(const [label,delta] of [["↑",-1],["↓",1]]){const b=document.createElement("button");b.type="button";b.className="btn secondary";b.textContent=label;b.disabled=index+delta<0||index+delta>=total;b.onclick=()=>{const arr=kind==="video"?box._videos:box._photos;[arr[index],arr[index+delta]]=[arr[index+delta],arr[index]];refreshMedia(box)};actions.append(b)}const rm=document.createElement("button");rm.type="button";rm.className="btn secondary";rm.textContent="Remover";rm.onclick=()=>{const arr=kind==="video"?box._videos:box._photos;arr.splice(index,1);refreshMedia(box)};actions.append(rm);item.append(actions);return item}
function updatePreview(box){const area=box.querySelector(".preview-card"),first=box._photos[0];let media=area.querySelector(".preview-media");if(!media){media=document.createElement("div");media.className="preview-media";area.prepend(media)}media.replaceChildren();if(first){const img=document.createElement("img");img.src=first;img.alt="Prévia do anúncio";media.append(img)}else media.textContent="Adicione uma foto para ver a prévia.";
const name=box.querySelector('[data-key="name"]').value.trim()||"Nome do anúncio",age=box.querySelector('[data-key="age"]').value,city=box.querySelector('[data-key="city"]').value,bio=box.querySelector('[data-key="bio"]').value.trim()||"Descrição do anúncio";
area.querySelector(".preview-text").innerHTML='<small>PRÉVIA DA VITRINE</small><h3>'+esc(name)+(age?" · "+esc(age)+" anos":"")+'</h3><p>'+esc(city)+'</p><p>'+esc(bio)+'</p>'}
function refreshMedia(box){for(const kind of ["photos","videos"]){const arr=kind==="photos"?box._photos:box._videos;box.querySelector('[data-list="'+kind+'"]').replaceChildren(...arr.map((u,i)=>makeMediaItem(u,kind==="photos"?"image":"video",i,arr.length,box)))}updatePreview(box)}
function createEditor(p){const box=document.createElement("article");box.className="profile";box.dataset.profileId=p.id||"ad-"+crypto.randomUUID();box._photos=Array.isArray(p.photos)?[...p.photos]:[];box._videos=Array.isArray(p.videos)?[...p.videos]:[];box.innerHTML='<div class="row"><div class="field"><label>Nome público</label><input data-key="name" maxlength="80" autocomplete="off"></div><div class="field"><label>Idade (mínimo 18)</label><input data-key="age" type="number" min="18" max="99"></div></div><div class="row"><div class="field"><label>Cidade (opcional)</label><input data-key="city" maxlength="80"></div><div class="field"><label>Descrição</label><textarea data-key="bio" maxlength="500" rows="4"></textarea></div></div><div class="media-tools"><div class="field"><label>Fotos</label><input type="file" accept="image/jpeg,image/png,image/webp,image/avif" multiple data-upload="photos"><span class="help">JPEG, PNG, WebP ou AVIF · até 12 arquivos de 15 MB</span><div class="media-list" data-list="photos"></div></div><div class="field"><label>Vídeos</label><input type="file" accept="video/mp4,video/webm,video/quicktime" multiple data-upload="videos"><span class="help">MP4, WebM ou MOV · até 6 arquivos de 40 MB</span><div class="media-list" data-list="videos"></div></div></div><details class="preview"><summary>Pré-visualizar anúncio</summary><div class="preview-card"><div class="preview-media"></div><div class="preview-text"></div></div></details><div class="checks"><label><input data-key="adultVerified" type="checkbox"> Maioridade verificada</label><label><input data-key="consent" type="checkbox"> Autorização confirmada</label><label><input data-key="published" type="checkbox"> Publicado</label></div><p class="help">Publique somente com autorização da titular e confirmação de maioridade.</p><p class="status upload-status" role="status" aria-live="polite"></p>';
for(const k of ["name","age","city","bio"])box.querySelector('[data-key="'+k+'"]').value=p[k]??"";for(const k of ["adultVerified","consent","published"])box.querySelector('[data-key="'+k+'"]').checked=p[k]===true;
box.querySelectorAll("[data-key]").forEach(el=>el.addEventListener("input",()=>updatePreview(box)));box.querySelectorAll("[data-upload]").forEach(el=>el.addEventListener("change",()=>uploadFiles(box,el)));refreshMedia(box);return box}
async function uploadFiles(box,input){const kind=input.dataset.upload,files=[...input.files],arr=kind==="photos"?box._photos:box._videos,status=box.querySelector(".upload-status");input.value="";if(arr.length+files.length>(kind==="photos"?12:6)){status.textContent="Limite de arquivos deste anúncio excedido.";return}for(const file of files){const max=kind==="photos"?15*1024*1024:40*1024*1024;if(file.size>max){status.textContent=file.name+" ultrapassa o limite permitido.";continue}status.textContent="Enviando "+file.name+"…";try{const r=await fetch("/api/admin/media-upload",{method:"POST",credentials:"same-origin",headers:{"content-type":file.type},body:file});const d=await r.json();if(!r.ok)throw Error(d.error||"Falha no envio.");arr.push(d.url);refreshMedia(box);status.textContent=file.name+" enviado."}catch(e){status.textContent=e.message}}}
function collectEditor(){const box=$("profileEditor").firstElementChild,get=k=>box.querySelector('[data-key="'+k+'"]'),old=(content.profiles||[]).find(p=>p.id===editingId)||{};const age=get("age").value?Number(get("age").value):null,photos=[...box._photos],videos=[...box._videos];if(age!==null&&age<18)throw Error("A idade precisa ser 18 ou mais.");if(photos.length>12||videos.length>6||[...photos,...videos].some(u=>!safeMedia(u)))throw Error("Confira quantidade e endereço de fotos e vídeos.");return{...old,id:editingId||box.dataset.profileId,name:get("name").value.trim(),age,bio:get("bio").value.trim(),city:get("city").value.trim(),photos,videos,adultVerified:get("adultVerified").checked,consent:get("consent").checked,published:get("published").checked}}
function openEditor(id=null){isNewAd=!id;editingId=id;const current=id?(content.profiles||[]).find(p=>p.id===id):{id:"",name:"",age:null,bio:"",city:"",photos:[],videos:[],adultVerified:false,consent:false,published:false};if(!current){$("saveStatus").textContent="Anúncio não encontrado.";return}const copy={...current,photos:[...(current.photos||[])],videos:[...(current.videos||[])]};$("editTitle").textContent=isNewAd?"Novo anúncio":"Editar: "+(copy.name||"anúncio");$("profileEditor").replaceChildren(createEditor(copy));$("listView").classList.add("hidden");$("editView").classList.remove("hidden");$("saveStatus").textContent="";window.scrollTo(0,0)}
function showList(){editingId=null;isNewAd=false;$("editView").classList.add("hidden");$("listView").classList.remove("hidden");renderList();window.scrollTo(0,0)}
async function saveCurrent(){try{$("saveStatus").textContent="Salvando…";const p=collectEditor(),profiles=[...(content.profiles||[])];if(isNewAd)profiles.push(p);else{const i=profiles.findIndex(x=>x.id===editingId);if(i<0)throw Error("Este anúncio não existe mais.");profiles[i]=p}const next={...content,profiles};await api("/api/admin/content","PUT",next);content=next;showList()}catch(e){$("saveStatus").textContent=e.message}}
async function deleteAd(id){const target=(content.profiles||[]).find(p=>p.id===id);if(!target)return;if(!window.confirm("Excluir o anúncio “"+(target.name||"sem nome")+"”?"))return;try{const next={...content,profiles:content.profiles.filter(p=>p.id!==id)};await api("/api/admin/content","PUT",next);content=next;renderList()}catch(e){$("listStatus").textContent=e.message}}
async function saveSiteSettings(){try{$("siteStatus").textContent="Salvando…";const next={...content,site:{...content.site,brand:"PRIV",city:$("city").value.trim(),about:$("about").value.trim()}};await api("/api/admin/content","PUT",next);content=next;$("siteStatus").textContent="Configurações salvas."}catch(e){$("siteStatus").textContent=e.message}}
async function startEditor(){try{$("loadStatus").textContent="Conferindo acesso…";const session=await api("/api/admin/session");if(session.email!==allowedEmail)throw Error("Esta conta não tem permissão para gerenciar anúncios.");content=await api("/api/admin/content");$("city").value=content.site?.city||"";$("about").value=content.site?.about||"";$("loadStatus").classList.add("hidden");$("editor").classList.remove("hidden");$("logout").classList.remove("hidden");showList()}catch(e){$("editor").classList.add("hidden");$("loadStatus").classList.remove("hidden");$("loadStatus").textContent=e.message==="Entre novamente para continuar."?"A sessão administrativa expirou. Entre na conta administradora e abra o gerenciador novamente.":e.message}}
$("addProfile").onclick=()=>openEditor();$("backToList").onclick=showList;$("cancelEdit").onclick=showList;$("saveProfile").onclick=saveCurrent;$("saveSite").onclick=saveSiteSettings;$("logout").onclick=()=>{location.assign("/")};
$("profileList").addEventListener("click",event=>{const edit=event.target.closest("[data-edit-id]");if(edit)openEditor(edit.dataset.editId)});
startEditor();</script></body></html>
